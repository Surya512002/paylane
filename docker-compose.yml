services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workpay
      POSTGRES_PASSWORD: workpay
      POSTGRES_DB: workpay
    ports:
      - "5432:5432"
    volumes:
      - workpay_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workpay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workpay_pg:
