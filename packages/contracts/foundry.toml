[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
arc_testnet = "${ARC_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC:-https://sepolia.base.org}"
base = "${BASE_RPC:-https://mainnet.base.org}"

[etherscan]
# Arc Testnet uses Blockscout via: forge verify-contract --verifier blockscout --verifier-url https://testnet.arcscan.app/api/
# Base Sepolia uses ETHERSCAN_API_KEY with --verifier etherscan --chain base-sepolia
